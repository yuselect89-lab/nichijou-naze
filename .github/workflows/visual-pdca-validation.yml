name: Visual PDCA candidate validation

on:
  push:
    branches:
      - visual-qc-pilot-20261023
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Version info
        run: |
          node --version
          python3 --version
          ffmpeg -version | head -1
      - name: Approved asset and configuration preflight
        run: npm run preflight
      - name: All tests including visual PDCA motion fixture
        run: npm test
